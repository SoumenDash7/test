<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Greetings!</title>
    <style>
        /* Floating background effect */
        body {
            background-image: url('bougainvillea-2477086_1280.jpg'); /* Your flower image */
            background-size: cover;
            background-position: center;
            text-align: center;
            color: white;
            font-family: 'Arial', sans-serif;
            height: 100vh; /* Full screen height */
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Animation for floating effect */
        @keyframes floatEffect {
            0% {
                transform: translateY(0); /* Starting position */
            }
            50% {
                transform: translateY(-10px); /* Slightly move up */
            }
            100% {
                transform: translateY(0); /* Return to starting position */
            }
        }

        h1 {
            color: #ffad14;
            font-size: 4em;
            margin-top: 100px;
        }

        p {
            font-size: 1.5em;
            color: white;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.6); /* Adds a transparent background to make the text stand out */
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }

        img {
            width: 300px;
            border-radius: 10px;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-style: italic;
            position: absolute;
            bottom: 10px; /* Stick footer at the bottom */
            width: 100%; /* Make sure footer spans the width */
        }

        /* Style for the Play/Pause button */
        #playPauseBtn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ffad14;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
        }

        #playPauseBtn:hover {
            background-color: #ff8c00;
        }

        /* Style the audio player as a small square box */
        audio {
            width: 50px; /* Small width */
            height: 50px; /* Small height */
            border: none; /* Remove default border */
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Birthday Greetings, Dr. Sonia S!!</h1>
        <p>Wishing you all the happiness in the world on your special day!</p>
        <img src="ba946f247aa066fd175f57e82a967df9.jpg" alt="Birthday Cake">
        
        <!-- Audio Player and Play/Pause Button -->
        <audio id="birthdaySong" controls>
            <source src="YOUR_AUDIO_LINK_HERE" type="audio/mp3"> <!-- Add your audio link here -->
            Your browser does not support the audio element.
        </audio>
        
        <button id="playPauseBtn">Play</button>
    </div>

    <footer>
        Crafted with ❤️ by SSD
    </footer>

    <script>
        // Play/Pause Button functionality
        const audio = document.getElementById('birthdaySong');
        const playPauseBtn = document.getElementById('playPauseBtn');

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.textContent = 'Pause';
            } else {
                audio.pause();
                playPauseBtn.textContent = 'Play';
            }
        });
    </script>
</body>
</html>
